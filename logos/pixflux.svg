<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PixFlux logo">
  <defs>
    <linearGradient id="pixflux-icon-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="0.5" stop-color="#6EE7B7"/>
      <stop offset="1" stop-color="#FBCFE8"/>
    </linearGradient>
  </defs>

  <!-- rounded-square container -->
  <rect width="1024" height="1024" rx="256" fill="url(#pixflux-icon-bg)"/>

  <!-- image frame -->
  <rect x="312" y="328" width="400" height="368" rx="48" fill="#0B0A0F"/>

  <!-- interior cut-out: mountain peaks -->
  <path d="M372 616 L488 472 L568 552 L648 456 L648 640 L372 640 Z"
        fill="url(#pixflux-icon-bg)"/>

  <!-- sun / pixel dot -->
  <circle cx="592" cy="448" r="44" fill="url(#pixflux-icon-bg)"/>

  <!-- top-right arc: rotated inward -->
  <g transform="rotate(20 814 456)">
    <path d="M744 400 A 140 140 0 0 1 884 512"
          stroke="#0B0A0F" stroke-width="48" fill="none" stroke-linecap="round"/>
    <path d="M884 512 L932 466 M884 512 L836 466"
          stroke="#0B0A0F" stroke-width="48" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- bottom-left arc: rotated inward -->
  <g transform="rotate(20 210 568)">
    <path d="M280 624 A 140 140 0 0 1 140 512"
          stroke="#0B0A0F" stroke-width="48" fill="none" stroke-linecap="round"/>
    <path d="M140 512 L92 558 M140 512 L188 558"
          stroke="#0B0A0F" stroke-width="48" fill="none"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
